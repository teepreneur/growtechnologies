<div id="set"></div>
<script>
/* KOPIA Ghana Center – smart greenhouse renovation
 * SINGLE SOURCE OF TRUTH for the component register, the 2D drawings and the 3D model.
 * Edit here, and the register, drawings and model all follow.
 *
 * Units: metres. Axes: x = along the greenhouse (0 = entrance gable, 24.1 = far gable),
 * y = across (0 = left wall when standing at the entrance looking in, 11.3 = right wall),
 * z = up from finished ground level.
 * The nursery house sits parallel to the main house on the left (negative y), with a 2.0 m gap (ASSUMED).
 *
 * No prices here on purpose: this is the "is anything missing?" stage.
 * status: new | existing | reuse | relocate | optional
 */
(function () {
  const H = {
    main:    { name: 'Main greenhouse', x0: 0, y0: 0,    L: 24.1, W: 11.3, sideH: 2.8, ridgeH: 5.0 },
    nursery: { name: 'Nursery house',   x0: 0, y0: -7.3, L: 24.1, W: 5.3,  sideH: 2.4, ridgeH: 3.8 },
  };
  const AISLE = { y0: 5.05, y1: 6.25 };           // main-house central aisle
  const TRENCH = { y0: 5.35, y1: 5.95, depth: 0.3 }; // concrete pipe trench under the aisle

  // arch height of a house at a given y (semi-elliptical roof over vertical side walls)
  function archZ(h, y) {
    const half = h.W / 2, c = h.y0 + half;
    const u = Math.min(1, Math.abs(y - c) / half);
    return h.sideH + (h.ridgeH - h.sideH) * Math.sqrt(1 - u * u);
  }

  const box = (x0, y0, z0, x1, y1, z1) => ({ t: 'box', x0, y0, z0, x1, y1, z1 });
  const cyl = (x, y, z0, r, h) => ({ t: 'cyl', x, y, z0, r, h });
  const pipe = (d, ...pts) => ({ t: 'pipe', d, pts });

  const items = [];
  const add = (o) => { items.push(Object.assign({ status: 'new', qty: 1, unit: 'no.', geo: [] }, o)); };

  /* ---------------- ZONES ---------------- */
  const zones = [
    { id: 'SVC', house: 'main', name: 'Service & tank corner', x0: 0.2, x1: 3.3, y0: 0.2, y1: 11.1, color: '#8a8f99' },
    { id: 'TOM', house: 'main', name: 'Tomato – drip Dutch buckets', x0: 3.4, x1: 16.4, y0: 0.4, y1: 4.9, color: '#c8553d' },
    { id: 'LET', house: 'main', name: 'Lettuce – vertical NFT A-frames', x0: 3.4, x1: 9.7, y0: 6.5, y1: 11.0, color: '#5a9e3a' },
    { id: 'STB', house: 'main', name: 'Strawberry cool chamber', x0: 10.0, x1: 15.6, y0: 6.6, y1: 10.9, color: '#d1495b' },
    { id: 'DEM', house: 'main', name: 'Teaching benches – wick & Kratky', x0: 15.9, x1: 17.1, y0: 6.6, y1: 10.9, color: '#e0a526' },
    { id: 'AQU', house: 'main', name: 'Aquaponics – tilapia + rafts', x0: 17.3, x1: 23.9, y0: 0.3, y1: 11.1, color: '#2f7fb5' },
    { id: 'NUR', house: 'nursery', name: 'Nursery – seedlings', x0: 0.3, x1: 23.8, y0: -7.0, y1: -2.3, color: '#7b6cb0' },
    { id: 'EXT', house: 'site', name: 'Outside – water, power, outdoor units', x0: -4, x1: 28, y0: 11.3, y1: 14, color: '#666' },
  ];

  /* ---------------- CATEGORIES ---------------- */
  const categories = [
    { id: 'STR', name: 'Structures & civil works', color: '#9c8b74' },
    { id: 'GRW', name: 'Growing systems', color: '#4f9d4a' },
    { id: 'TNK', name: 'Tanks & reservoirs', color: '#3c6e9f' },
    { id: 'WTR', name: 'Water treatment (salty water → RO)', color: '#2aa3b3' },
    { id: 'PMP', name: 'Pumps & aeration', color: '#1f5f8b' },
    { id: 'PIP', name: 'Pipes, valves & fittings', color: '#d9d9d9' },
    { id: 'SNS', name: 'Sensors', color: '#e8590c' },
    { id: 'CTL', name: 'Automation & control', color: '#7048e8' },
    { id: 'CLM', name: 'Climate control (fans, shade, AC, chiller)', color: '#868e96' },
    { id: 'ELC', name: 'Electrical & backup power', color: '#f2c12e' },
    { id: 'LGT', name: 'Lighting', color: '#ffd8a8' },
    { id: 'STP', name: 'Start-up stock, consumables & spares', color: '#adb5bd' },
    { id: 'SRV', name: 'Services (design, install, commissioning, training)', color: '#495057' },
  ];

  /* ======================= STRUCTURES & CIVIL ======================= */
  add({ tag: 'STR-01', where: 'Whole main house', cat: 'STR', zone: 'SVC', name: 'Clear-out of old tomato troughs, liners and drip strips', spec: 'Remove and dispose of the old ground troughs, plastic liner and dead plants; level the ground', qty: 1, unit: 'lot' });
  add({ tag: 'STR-02', where: 'Whole main house', cat: 'STR', zone: 'SVC', name: 'Main house roof film replacement', spec: 'UV-stabilised greenhouse PE film 200 µm, anti-drip, about 24.1 m × 12.6 m arch + 2 gables', qty: 340, unit: 'm²', note: 'Area estimated from the assumed 5.0 m ridge – measure on site' });
  add({ tag: 'STR-03', where: 'Whole main house', cat: 'STR', zone: 'SVC', name: 'Main house insect-net side walls and gables', spec: '50-mesh UV insect net, both sides 24.1 × 2.8 m + gable panels', qty: 160, unit: 'm²' });
  add({ tag: 'STR-04', where: 'Whole main house', cat: 'STR', zone: 'SVC', name: 'Roll-up side curtains – repair and new crank winders', spec: 'Curtain film both sides, roll bars, 2 crank winders, curtain stops', qty: 2, unit: 'sides' });
  add({ tag: 'STR-05', cat: 'STR', zone: 'SVC', name: 'Entrance porch rebuild with double insect-proof doors', spec: '2.18 × 1.55 m porch, steel frame, net walls, 2 self-closing doors (airlock)', qty: 1, unit: 'no.', geo: [box(-1.55, 4.56, 0, 0, 6.74, 2.3)] });
  add({ tag: 'STR-06', cat: 'STR', zone: 'AQU', name: 'Far-end door (at old fan position)', spec: 'Steel-framed net door 1.2 × 2.1 m, centred on the gable', qty: 1, unit: 'no.', geo: [box(24.05, 5.05, 0, 24.15, 6.25, 2.1)] });
  add({ tag: 'STR-07', where: 'Whole main house (aisle)', cat: 'STR', zone: 'SVC', name: 'Concrete pipe trench with removable covers – main run', spec: 'Under the central aisle, 0.6 m wide × 0.3 m deep, 10–15 cm concrete walls and base, removable precast covers', qty: 23.5, unit: 'm', note: 'Concrete thickness 10 or 15 cm – CONFIRM', geo: [box(0.3, TRENCH.y0, -0.3, 23.8, TRENCH.y1, 0)] });
  add({ tag: 'STR-08', where: 'Whole main house', cat: 'STR', zone: 'SVC', name: 'Concrete pipe trench – branches to tanks and zones', spec: 'Same build as STR-07; branches to the RO tank, lettuce tanks, chamber and aquaponics rafts/sump', qty: 14, unit: 'm', geo: [
    box(1.7, 1.9, -0.25, 2.1, 5.35, 0), box(2.3, 5.95, -0.25, 2.7, 8.4, 0), box(15.6, 5.95, -0.25, 16.0, 7.2, 0), box(17.6, 4.4, -0.25, 18.0, 5.35, 0), box(17.6, 5.95, -0.25, 18.0, 7.0, 0)] });
  add({ tag: 'STR-09', where: 'Whole main house (aisle)', cat: 'STR', zone: 'SVC', name: 'Aisle surface', spec: 'Compacted gravel on weed mat each side of the trench covers (1.2 m walkway in total)', qty: 24, unit: 'm', geo: [box(0, AISLE.y0, -0.02, 24.1, AISLE.y1, 0)] });
  add({ tag: 'STR-10', where: 'All tank areas', cat: 'STR', zone: 'SVC', name: 'Tank plinths (concrete pads)', spec: '10 cm reinforced pads under the RO tank, tomato tank, lettuce reservoir, strawberry tank, fish tank and nursery tank (the sump is part-buried)', qty: 6, unit: 'no.', geo: [box(0.3, 0.3, -0.02, 1.9, 1.9, 0.08), box(0.5, 2.3, -0.02, 1.7, 3.5, 0.08), box(2.0, 8.3, -0.02, 3.2, 9.4, 0.08), box(20.9, 0.3, -0.02, 22.7, 2.1, 0.08), box(14.55, 6.95, -0.02, 15.45, 7.85, 0.08), box(22.1, -5.5, -0.02, 23.1, -4.5, 0.08)] });
  add({ tag: 'STR-11', cat: 'STR', zone: 'TOM', name: 'Tomato raised base (15 cm)', spec: 'Concrete-block or paver plinth 15 cm high under each bucket line, with a fall of 1:100 to the drain end', qty: 6, unit: 'lines × 12.9 m' });
  add({ tag: 'STR-12', cat: 'STR', zone: 'TOM', name: 'Tomato trellis / high-wire system', spec: '2.4 m high wires over each bucket line, anchored to the hoops via cross-members; roller hooks + twine', qty: 6, unit: 'lines', note: 'Check the hoop frame can carry the crop load (about 15 kg/m)' });
  add({ tag: 'STR-13', cat: 'STR', zone: 'STB', name: 'Strawberry chamber frame and cladding', spec: '5.6 × 4.3 × 2.5 m galvanised/aluminium frame, 6 mm twin-wall polycarbonate walls and roof, sealed joints', qty: 1, unit: 'no.', geo: [box(10.0, 6.6, 0, 15.6, 10.9, 2.5)] });
  add({ tag: 'STR-14', cat: 'STR', zone: 'STB', name: 'Strawberry chamber door', spec: 'Insulated, self-closing door 0.9 × 2.1 m on the aisle side, with a brush seal', qty: 1, unit: 'no.' });
  add({ tag: 'STR-15', cat: 'STR', zone: 'STB', name: 'Extra shade net over the chamber', spec: '50 % aluminet/shade net on top of the chamber roof', qty: 26, unit: 'm²' });
  add({ tag: 'STR-16', where: 'Both gables', cat: 'STR', zone: 'CLM', name: 'Fan mounting frames in the gables', spec: 'Steel frames + flashing for 4 × 1.27 m box fans, insect-net cowls', qty: 4, unit: 'no.' });
  add({ tag: 'STR-17', cat: 'STR', zone: 'EXT', name: 'Drain line and soakaway for RO brine and tank dumps', spec: 'Soakaway pit or approved discharge point, about 1.5 × 1.5 × 1.5 m, outside the house', qty: 1, unit: 'no.', geo: [box(-3.5, 9.5, -0.3, -2.0, 11.0, 0.05)] });
  add({ tag: 'STR-18', cat: 'STR', zone: 'NUR', name: 'Nursery: concrete pipe cover along the centre', spec: 'As STR-07, 23.5 m', qty: 23.5, unit: 'm', geo: [box(0.3, -4.95, -0.3, 23.8, -4.35, 0)] });
  add({ tag: 'STR-19', cat: 'STR', zone: 'NUR', name: 'Nursery: roof film / net repairs', spec: 'Patch or replace damaged film and net', qty: 1, unit: 'lot', note: 'Condition to check – the photos show it in better shape than the main house' });
  add({ tag: 'STR-20', cat: 'STR', zone: 'EXT', name: 'Outdoor-unit platform and shade (AC + chiller)', spec: 'Concrete pad + small roof outside the right wall, next to the chamber', qty: 1, unit: 'no.', geo: [box(12.0, 11.6, 0, 15.0, 12.6, 0.1)] });

  /* ======================= GROWING SYSTEMS ======================= */
  // Tomato: 6 lines of Dutch buckets
  const tomLines = [0.85, 1.35, 2.45, 2.95, 4.05, 4.55];
  const bucketsPerLine = Math.floor((16.2 - 3.6) / 0.30) + 1; // 43
  const tomGeo = [];
  tomLines.forEach((y) => { for (let i = 0; i < bucketsPerLine; i++) { const x = 3.6 + i * 0.30; tomGeo.push(box(x - 0.13, y - 0.15, 0.15, x + 0.13, y + 0.15, 0.40)); } });
  const tomBase = tomLines.map((y) => box(3.45, y - 0.2, 0, 16.35, y + 0.2, 0.15));
  add({ tag: 'GRW-01', cat: 'GRW', zone: 'TOM', name: 'Dutch (Bato) buckets – tomato', spec: '11 L Dutch buckets with siphon elbow, 1 plant each, 30 cm spacing (KOPIA spacing)', qty: bucketsPerLine * tomLines.length, unit: 'no.', geo: tomGeo });
  add({ tag: 'GRW-02', cat: 'GRW', zone: 'TOM', name: 'Raised base geometry (see STR-11)', spec: '—', qty: 0, unit: '—', geo: tomBase, hidden: true });
  add({ tag: 'GRW-03', cat: 'GRW', zone: 'TOM', name: 'Tomato growing medium', spec: 'Perlite / coco-chip mix (or clay pebbles) for the buckets', qty: Math.ceil(bucketsPerLine * tomLines.length * 11 / 50), unit: 'bags (50 L)' });
  add({ tag: 'GRW-04', cat: 'GRW', zone: 'TOM', name: 'Tomato drain collector pipe under the buckets', spec: '50 mm PVC, 1:100 fall to the service end, into drain sump TNK-05', qty: 6 * 13, unit: 'm', geo: tomLines.map((y) => pipe(0.05, [16.3, y, 0.12], [3.4, y, 0.10], [2.75, 1.0, 0.05])) });

  // Lettuce NFT A-frames
  const aFrames = [7.5, 9.9];
  const nftGeo = []; const nftCh = [];
  aFrames.forEach((yc) => {
    nftGeo.push(box(3.8, yc - 0.65, 0, 9.4, yc - 0.6, 1.85), box(3.8, yc + 0.6, 0, 9.4, yc + 0.65, 1.85));
    [0.35, 0.7, 1.05, 1.4, 1.75].forEach((z, k) => {
      const off = 0.6 - k * 0.11;
      nftCh.push(box(3.8, yc - off - 0.1, z, 9.4, yc - off, z + 0.05), box(3.8, yc + off, z, 9.4, yc + off + 0.1, z + 0.05));
    });
  });
  const holesPerCh = Math.floor(5.6 / 0.2);
  add({ tag: 'GRW-05', cat: 'GRW', zone: 'LET', name: 'NFT A-frame racks (galvanised / aluminium)', spec: '5.6 m long × 1.3 m wide × 1.85 m high, 5 channel levels per side', qty: aFrames.length, unit: 'no.', geo: nftGeo });
  add({ tag: 'GRW-06', cat: 'GRW', zone: 'LET', name: 'NFT channels 100 × 50 mm food-grade', spec: `5.6 m long, holes at 20 cm → ${holesPerCh} plants per channel, 1:40 slope, end caps`, qty: nftCh.length, unit: 'channels', note: `${nftCh.length * holesPerCh} lettuce plants in total`, geo: nftCh });
  add({ tag: 'GRW-07', cat: 'GRW', zone: 'LET', name: 'Net cups 50 mm + rockwool/oasis plugs', spec: 'For NFT and rafts (+10 % spare)', qty: Math.ceil((nftCh.length * holesPerCh + 432) * 1.1), unit: 'no.' });

  // Strawberry gutters (inside the chamber)
  const stbG = [7.4, 8.65, 9.9];
  const stbGeo = [];
  stbG.forEach((y) => { stbGeo.push(box(10.4, y - 0.17, 0.95, 14.4, y + 0.17, 1.15)); stbGeo.push(box(10.5, y - 0.05, 0, 10.6, y + 0.05, 0.95), box(12.35, y - 0.05, 0, 12.45, y + 0.05, 0.95), box(14.2, y - 0.05, 0, 14.3, y + 0.05, 0.95)); });
  add({ tag: 'GRW-08', cat: 'GRW', zone: 'STB', name: 'Elevated strawberry gutters on stands ("Korean high-bed")', spec: '4.0 m × 0.34 m substrate gutters at 1.0–1.15 m, 2 rows of plants at 20 cm → 40 plants per gutter', qty: stbG.length, unit: 'gutters', note: `${stbG.length * 40} strawberry plants`, geo: stbGeo });
  add({ tag: 'GRW-09', cat: 'GRW', zone: 'STB', name: 'Strawberry substrate', spec: 'Cocopeat : perlite 70 : 30, washed and buffered', qty: 6, unit: 'bags (50 L)' });

  // Teaching benches
  add({ tag: 'GRW-10', cat: 'GRW', zone: 'DEM', name: 'Wick-system teaching bench', spec: '1.2 × 0.8 m bench with 8 wick containers (lettuce/herbs), clear reservoirs so students can see the roots', qty: 1, unit: 'no.', geo: [box(16.05, 7.2, 0, 17.05, 8.4, 0.8)] });
  add({ tag: 'GRW-11', cat: 'GRW', zone: 'DEM', name: 'Kratky teaching bench', spec: '1.2 × 0.8 m bench with 6 Kratky tubs (no pump)', qty: 1, unit: 'no.', geo: [box(16.0, 8.8, 0, 17.0, 10.0, 0.8)] });

  // Aquaponics growing beds
  const rafts = [[6.6, 7.8], [8.25, 9.45], [9.9, 11.1]];
  add({ tag: 'GRW-12', cat: 'GRW', zone: 'AQU', name: 'DWC raft beds (aquaponics lettuce/basil/kangkong)', spec: '6.0 × 1.2 × 0.3 m deep beds on 0.5 m stands, food-safe EPDM/PE liner', qty: 3, unit: 'beds', note: '21.6 m² ≈ 430 plants', geo: rafts.map(([a, b]) => box(17.5, a, 0.5, 23.5, b, 0.8)) });
  add({ tag: 'GRW-13', cat: 'GRW', zone: 'AQU', name: 'Floating rafts (food-grade foam / XPS)', spec: '1.2 × 0.6 × 0.04 m boards with 50 mm holes at about 20 plants/m²', qty: 30, unit: 'boards' });
  add({ tag: 'GRW-14', cat: 'GRW', zone: 'AQU', name: 'Media (gravel) bed with bell siphon', spec: '2.5 × 1.0 × 0.3 m on a 0.6 m stand, expanded clay or 10–20 mm washed gravel (not limestone)', qty: 1, unit: 'no.', geo: [box(18.6, 3.6, 0.6, 21.1, 4.6, 0.9)] });
  add({ tag: 'GRW-15', cat: 'GRW', zone: 'AQU', name: 'Media for the gravel bed', spec: 'Expanded clay pebbles (LECA) 8–16 mm', qty: 0.75, unit: 'm³' });

  // Nursery
  const nurB = [[1.0, -6.7], [6.8, -6.7], [12.6, -6.7], [1.0, -3.4], [6.8, -3.4]];
  add({ tag: 'GRW-16', cat: 'GRW', zone: 'NUR', name: 'Seedling benches 5.0 × 0.8 m', spec: 'Steel benches with mesh tops and an ebb-and-flow tray option on 1 bench', qty: 5, unit: 'benches', status: 'reuse', note: 'Refurbish the existing benches if sound; otherwise new. "5 m × 80 cm × 5" from the sketch', geo: nurB.map(([x, y]) => box(x, y, 0, x + 5.0, y + 0.8, 0.8)) });
  add({ tag: 'GRW-17', cat: 'GRW', zone: 'NUR', name: 'Plug trays + germination medium', spec: '72/104/128-cell trays, peat-moss/cocopeat (as KOPIA already uses)', qty: 60, unit: 'trays' });

  /* ======================= TANKS ======================= */
  add({ tag: 'TNK-01', cat: 'TNK', zone: 'SVC', name: 'RO water storage tank', spec: '2,000 L food-grade polytank, opaque, lidded', qty: 1, unit: 'no.', geo: [cyl(1.1, 1.1, 0.08, 0.78, 1.35)] });
  add({ tag: 'TNK-02', cat: 'TNK', zone: 'SVC', name: 'Tomato mixing / feed tank', spec: '1,000 L opaque polytank, insulated jacket', qty: 1, unit: 'no.', geo: [cyl(1.1, 2.9, 0.08, 0.55, 1.25)] });
  add({ tag: 'TNK-03', cat: 'TNK', zone: 'SVC', name: 'Tomato stock tanks A and B', spec: '100 L each, with lids and stirrer', qty: 2, unit: 'no.', geo: [cyl(2.6, 2.4, 0.0, 0.25, 0.65), cyl(2.6, 3.0, 0.0, 0.25, 0.65)] });
  add({ tag: 'TNK-04', cat: 'TNK', zone: 'SVC', name: 'Tomato acid (pH-down) tank', spec: '30 L HDPE, acid-rated, bunded', qty: 1, unit: 'no.', geo: [cyl(2.6, 3.6, 0.0, 0.17, 0.5)] });
  add({ tag: 'TNK-05', cat: 'TNK', zone: 'SVC', name: 'Tomato drain-return sump', spec: '200 L, part-buried, receives bucket drainage before filtering back to TNK-02', qty: 1, unit: 'no.', geo: [cyl(2.75, 1.0, -0.4, 0.33, 0.7)] });
  add({ tag: 'TNK-06', cat: 'TNK', zone: 'SVC', name: 'Lettuce NFT reservoir', spec: '500 L opaque polytank, insulated', qty: 1, unit: 'no.', geo: [cyl(2.6, 8.85, 0.08, 0.45, 0.9)] });
  add({ tag: 'TNK-07', cat: 'TNK', zone: 'SVC', name: 'Lettuce stock tanks A, B + acid', spec: '60 L + 60 L + 25 L', qty: 3, unit: 'no.', geo: [cyl(1.5, 8.3, 0, 0.2, 0.6), cyl(1.5, 8.85, 0, 0.2, 0.6), cyl(1.5, 9.4, 0, 0.15, 0.45)] });
  add({ tag: 'TNK-08', cat: 'TNK', zone: 'STB', name: 'Strawberry reservoir (chilled)', spec: '300 L polytank in a 50 mm insulated jacket, inside the chamber', qty: 1, unit: 'no.', geo: [cyl(15.0, 7.4, 0.08, 0.38, 0.9)] });
  add({ tag: 'TNK-09', cat: 'TNK', zone: 'STB', name: 'Strawberry stock tanks A, B + acid', spec: '30 L + 30 L + 20 L', qty: 3, unit: 'no.', geo: [cyl(14.85, 8.4, 0, 0.15, 0.5), cyl(14.85, 8.8, 0, 0.15, 0.5), cyl(14.85, 9.2, 0, 0.12, 0.4)] });
  add({ tag: 'TNK-10', cat: 'TNK', zone: 'AQU', name: 'Fish tank', spec: '2,000 L round tank, 1.6 m dia × 1.15 m, food-grade, with a centre drain and lid/net', qty: 1, unit: 'no.', geo: [cyl(21.8, 1.2, 0.08, 0.8, 1.15)] });
  add({ tag: 'TNK-11', cat: 'TNK', zone: 'AQU', name: 'Swirl (radial-flow) solids filter', spec: '200 L conical, sludge valve', qty: 1, unit: 'no.', geo: [cyl(19.9, 0.9, 0.0, 0.3, 0.95)] });
  add({ tag: 'TNK-12', cat: 'TNK', zone: 'AQU', name: 'Biofilter / mineralisation tank', spec: '300 L with K1 moving-bed media + aeration', qty: 1, unit: 'no.', geo: [cyl(19.9, 2.05, 0.0, 0.35, 1.0)] });
  add({ tag: 'TNK-13', cat: 'TNK', zone: 'AQU', name: 'Aquaponics sump', spec: '500 L, lowest point of the loop', qty: 1, unit: 'no.', geo: [cyl(17.95, 4.2, -0.3, 0.48, 0.8)] });
  add({ tag: 'TNK-14', cat: 'TNK', zone: 'NUR', name: 'Nursery feed/misting tank', spec: '500 L opaque polytank (RO water + weak nutrient)', qty: 1, unit: 'no.', geo: [cyl(22.6, -5.0, 0.08, 0.45, 0.9)] });
  add({ tag: 'TNK-15', cat: 'TNK', zone: 'EXT', name: 'Existing raw-water tank on stand', spec: 'Existing elevated black polytank (salty borehole/mains water)', qty: 1, unit: 'no.', status: 'existing', geo: [box(-3.6, 12.4, 0, -2.4, 13.6, 3.0), cyl(-3.0, 13.0, 3.0, 0.7, 1.6)] });

  function dimH(x0, x1, y, txt, o = {}) {

  function archPath(h, V) { // cross-section roof profile

  }
  function zonesPlan(v, house, L) {
    let s = '', lab = '';
    K.zones.filter(z => z.house === house).forEach(z => {
      const x = v.X(z.x0), y = v.Y(z.y0), w = (z.x1 - z.x0) * v.s, h = (z.y1 - z.y0) * v.s;

    });

  }
  function houseOutline(v, h, sw = 0.7) { return rectS(v.X(h.x0), v.Y(h.y0), h.L * v.s, h.W * v.s, `fill="none" stroke="#111" stroke-width="${sw}"`); }
  function sectionMark(x, y, letter, dir) { // dir: arrow direction 'u','d','l','r'

  const levelZ = {

      .forEach((t, i) => out += T(271, by + 5 + i * 3.6, t, { fs: 1.9, bold: i === 0 }));
    // key
    out += T(14, 250, 'LINE KEY', { fs: 2.2, bold: true }) + line(14, 254, 26, 254, PW) + T(28, 254.7, '230 V AC power', { fs: 1.9 }) + line(14, 259, 26, 259, DC) + T(28, 259.7, '24 V DC backup', { fs: 1.9 }) + line(14, 264, 26, 264, DATA) + T(28, 264.7, 'data / control', { fs: 1.9 });
    out += T(14, 272, 'Box colours follow the component-register categories. Node lists show which sensors and actuators each controller reads/drives.', { fs: 1.8, fill: '#444' });
    return out;
  });

  /* ---- D-08 Notes, assumptions, open questions ---- */
  sheet('D-08', 'Notes, assumptions and open questions', 'NTS', () => {
    let out = '';
    const col = (x, y, title, lines, w) => { out += T(x, y, title, { fs: 3.1, bold: true }); y += 5.5; lines.forEach(l => { wrap(l, w).forEach((ln, k) => { out += T(x + (k ? 3.5 : 0), y, ln, { fs: 2.45 }); y += 3.7; }); y += 1.1; }); return y; };
    const general = ['1. All dimensions in metres and levels from finished ground level (FGL) unless noted.', '2. Drawings are generated from design-data.js – the same file that drives the component register and the 3D model.', '3. Rev A is FOR REVIEW ONLY. Not for construction until the open questions are closed and site dimensions are measured.', '4. Electrics stay overhead and away from water: cable tray at 2.6 m, IP65/66 enclosures, 30 mA RCBO on every circuit.', '5. The raw water is salty: every crop tank, the nursery and the fish top-up are fed from the RO tank. Brine goes to the soakaway only.', '6. Fish water flows ONE WAY to the tomato tank. Nutrient solution never returns to the fish.', '7. Concrete is a pipe trench with removable covers along the aisle – not a full floor.', '8. In a power cut the 24 V LiFePO4 bus keeps the fish air pumps, controllers and alarms running ≥ 8 h.'];
    let y = col(14, 20, 'GENERAL NOTES', general, 70);
    y = col(14, y + 4, 'ASSUMPTIONS (from design-data.js)', K.assumptions.map((a, i) => (i + 1) + '. ' + a), 70);
    const oq = ['Concrete pipe-trench thickness: 10 cm or 15 cm?', 'What do the site notes "8 cm" and "30 × 5" refer to?', 'Nursery width: 5.3 m or 11.3 m? Nursery position relative to the main house?', 'Measure side-wall and ridge heights of both houses (2.8 / 5.0 m assumed).', 'Existing fan size/model; positions of the 2 new fans; airflow direction.', 'Compass orientation of the houses (sun path, fan side).', 'Water lab test (EC, Na, Cl, hardness) to size the RO unit.', 'ECG supply: distance to the meter, capacity, outage pattern.', 'Can the hoop frame carry the tomato high-wire load (≈15 kg/m)?', 'Which zone gets LED day-length lighting (nursery and/or strawberry)?', 'Are the existing nursery benches sound enough to reuse?'];
    const flagged = K.items.filter(i => i.note && /CONFIRM|measure|check|ASSUM/i.test(i.note)).map(i => i.tag + ' – ' + i.note);
    let y2 = col(148, 20, 'OPEN QUESTIONS – CLOSE BEFORE PRICING', oq.map((q, i) => (i + 1) + '. ' + q), 68);
    y2 = col(150, y2 + 4, 'ITEMS FLAGGED IN THE DATA FILE', flagged, 68);
    const notNew = K.items.filter(i => i.status !== 'new').map(i => i.tag + ' (' + i.status + ') – ' + i.name);
    let y3 = col(282, 20, 'ITEMS THAT ARE NOT "NEW"', notNew, 66);
    const c = K.counts;
    y3 = col(282, y3 + 4, 'SYSTEM SUMMARY', [`Tomato: ${c.tomato} Dutch buckets (drip, recirculating)`, `Lettuce: ${c.lettuceNFT} NFT holes + wick/Kratky teaching benches`, `Strawberry: ${c.strawberry} plants in the cool chamber (AC + chiller)`, `Aquaponics: 2,000 L fish tank, ≈${c.rafts} raft holes + media bed`, `Nursery: ${byTag['GRW-16'].qty} benches with misting + LEDs`], 66);
    const per = K.categories.map(ct => `${ct.id}  ${String(K.items.filter(i => i.cat === ct.id && !i.hidden).length).padStart(2)} items – ${ct.name}`);
    col(282, Math.max(y3 + 4, 0), 'REGISTER SIZE BY CATEGORY', per, 66);
    return out;
  });

  /* ---------- frame + title block ---------- */
  function frame(sh, i, n) {
    let s = rectS(8, 8, 404, 281, 'fill="none" stroke="#111" stroke-width="0.7"');
    const tx = 230, ty = 245, tw = 182, th = 44;
    s += rectS(tx, ty, tw, th, 'fill="#fff" stroke="#111" stroke-width="0.5"');
    s += line(tx, ty + 11, tx + tw, ty + 11) + line(tx, ty + 21, tx + tw, ty + 21) + line(tx, ty + 33, tx + tw, ty + 33) + line(tx + 30, ty + 21, tx + 30, ty + 33);
    s += T(tx + 3, ty + 5.2, 'Grow Technologies (GrowTech)', { fs: 3.6, bold: true }) + T(tx + 3, ty + 9.1, 'Hydroponic vertical farms & smart-farm systems', { fs: 2 });
    s += T(tx + 3, ty + 15, 'Client:  KOPIA Ghana Center', { fs: 2.4 }) + T(tx + 3, ty + 19, 'Project: Smart greenhouse renovation', { fs: 2.4 });
    s += T(tx + 15, ty + 29.2, sh.no, { fs: 5, bold: true, anchor: 'middle' });
    wrap(sh.title, 46).slice(0, 2).forEach((ln, k, arr) => s += T(tx + 33, ty + (arr.length > 1 ? 25.8 : 28.4) + k * 3.6, ln, { fs: 2.9, bold: true }));
    s += T(tx + 3, ty + 37, 'Scale: ' + sh.scale, { fs: 2 }) + T(tx + tw - 3, ty + 37, 'Sheet ' + (i + 1) + ' of ' + n, { fs: 2, anchor: 'end' });
    s += T(tx + 3, ty + 41.5, 'Rev A – 24 Nov 2026 – FOR REVIEW, NOT FOR CONSTRUCTION', { fs: 2.5, bold: true, fill: '#c92a2a' });
    return s;
  }

  const want = +(new URLSearchParams(location.search).get('sheet') || 0);
  if (want) document.body.classList.add('single');
  let html = '';
  SHEETS.forEach((sh, i) => {
    if (want && want !== i + 1) return;
    let body;
    try { body = sh.fn(); } catch (e) { body = T(20, 40, 'ERROR: ' + e.message, { fs: 4, fill: 'red' }); console.error(e); }
    html += `<div class="sheet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm">${body}${frame(sh, i, SHEETS.length)}</svg></div>`;
  });
  document.getElementById('set').innerHTML = html;
})();
</script>
</body>
</html>
